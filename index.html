<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配信トラッカー</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--panel:#141926;--panel2:#1b2233;--line:#252d40;
  --txt:#e6ebf5;--sub:#8b95ad;--accent:#5b8cff;--live:#ff3b5c;--ok:#2ee6a8;--warn:#ffb340}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -10%,rgba(91,140,255,.12),transparent 60%)}
.wrap{position:relative;max-width:1320px;margin:0 auto;padding:26px 22px 70px}

.hd{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:24px}
.hd h1{font-size:19px;font-weight:800}
.hd .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pl 2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.hd .meta{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--txt)}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:11px;
  font-size:13px;font-weight:700;cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--txt);border-color:#3a4665}
.err{background:rgba(91,140,255,.10);border:1px solid rgba(91,140,255,.3);color:#a9c2ff;
  padding:11px 15px;border-radius:11px;margin-bottom:16px;font-size:13px}

/* ===== 全体（主役） ===== */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 26px 22px;margin-bottom:16px}
.heroTop{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.bigv{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigl{font-size:13px;color:var(--sub);letter-spacing:.06em;font-weight:700;margin-bottom:10px}
.deltas{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.dl{background:var(--panel2);border-radius:12px;padding:12px 16px;min-width:128px}
  .dl .l{font-size:11.5px;color:var(--sub);letter-spacing:.05em;margin-bottom:5px}
.dl .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.up{color:var(--ok)}.down{color:var(--live)}.flat{color:var(--sub)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--sub);padding:9px 17px;font-size:13.5px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.ctrl{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
#overall{height:440px!important}
.note{font-size:12.5px;line-height:1.7;color:#78829b;margin-top:14px}

.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:34px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.st .l{font-size:12px;color:var(--sub);letter-spacing:.05em;margin-bottom:7px}
.st .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.sect{font-size:14px;font-weight:800;color:var(--sub);letter-spacing:.1em;margin:0 0 12px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sect .sub{font-weight:500;letter-spacing:0;color:#8b95ad;font-size:12.5px}
.sect .sp{margin-left:auto}

.addbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.addbar input{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);padding:11px 15px;border-radius:11px;font-size:13.5px;outline:none}
.addbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
.addbar input::placeholder{color:#5a6480}

/* ===== 個別リスト（表のみ） ===== */
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thd,.trow{display:grid;grid-template-columns:34px 42px minmax(150px,1.8fr) 104px 104px 104px 96px 66px;
  gap:12px;align-items:center;padding:13px 16px}
.thd{background:var(--panel2);font-size:12px;color:var(--sub);letter-spacing:.06em;font-weight:800}
.trow{border-top:1px solid var(--line);cursor:pointer;transition:.14s}
.trow:hover{background:#1a2132}
.trow.dormant{opacity:.42}
.rk{font-size:13px;color:#5f6a83;font-weight:700;text-align:center}
.trow img{width:36px;height:36px;border-radius:9px;object-fit:cover;background:var(--panel2)}
.nm{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u2{font-size:11.5px;color:#5f6a83;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;gap:5px;align-items:center}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--panel2);
  color:var(--sub);border:1px solid var(--line);flex:0 0 auto}
.tag.pin{background:rgba(91,140,255,.18);color:var(--accent);border-color:transparent}
.tag.dor{background:rgba(255,179,64,.16);color:var(--warn);border-color:transparent}
.tag.live{background:var(--live);color:#fff;border-color:transparent}
.v2{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.v2 small{display:block;font-size:10.5px;color:#5f6a83;font-weight:600;margin-top:2px}
.pct{font-size:15px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.acts2{display:flex;gap:4px;justify-content:flex-end}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--sub);
  width:24px;height:24px;border-radius:7px;font-size:11px;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;text-decoration:none}
.iconbtn:hover{color:var(--txt);border-color:#3a4665}
.iconbtn.d:hover{color:var(--live)}
@media(max-width:900px){
  .thd,.trow{grid-template-columns:26px 32px 1fr 76px 66px}
  .hidesm{display:none}
}
.empty{text-align:center;padding:44px 20px;color:var(--sub);font-size:13.5px}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tabs button{background:transparent;border:0;color:var(--sub);padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.hmwrap{overflow-x:auto}
.hmg{display:grid;grid-template-columns:38px repeat(24,minmax(26px,1fr));gap:3px;min-width:760px}
.hmg .hl{font-size:12px;color:var(--sub);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-weight:700}
.hmg .hh{font-size:11px;color:var(--sub);text-align:center;font-weight:600}
.hmg .cell{aspect-ratio:1;border-radius:4px;background:#161c2b;transition:.12s}
.hmg .cell:hover{outline:2px solid var(--accent);z-index:2}
.hmleg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);margin-top:12px}
.hmleg i{width:18px;height:12px;border-radius:3px;display:inline-block}
.alert{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--panel2);
  border-radius:12px;margin-bottom:8px;border-left:3px solid var(--ok)}
.alert img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.alert .a1{font-size:14px;font-weight:700}
.alert .a2{font-size:11.5px;color:var(--sub);margin-top:2px}
.alert .a3{margin-left:auto;font-size:18px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.dur{display:grid;grid-template-columns:110px 1fr 92px 92px;gap:12px;align-items:center;
  padding:11px 14px;background:var(--panel2);border-radius:11px;margin-bottom:7px;font-size:13.5px}
.dur .bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.dur .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8ab4ff);border-radius:6px}
.dur .n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.dur .n small{display:block;font-size:10px;color:#5f6a83;font-weight:600}

/* ===== モーダル ===== */
.mask{position:fixed;inset:0;background:rgba(5,7,12,.82);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;padding:24px;z-index:50;overflow-y:auto}
.mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;
  max-width:960px;padding:24px;margin:auto}
.mh{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.avatar{width:54px;height:54px;flex:0 0 54px;border-radius:16px;object-fit:cover;background:var(--panel2)}
.mh h2{font-size:19px;font-weight:800}
.mh h2 a{color:inherit;text-decoration:none}
.mh h2 a:hover{color:var(--accent)}
.x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--sub);
  width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;flex:0 0 34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--panel2);border-radius:12px;padding:12px 13px}
.kpi .l{font-size:11.5px;color:var(--sub);letter-spacing:.05em;margin-bottom:6px}
.kpi .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.cbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px}
.cbox h3{font-size:14px;font-weight:700;margin-bottom:8px}
.cbox canvas{height:340px!important}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 15px;background:var(--panel2);
  border-radius:11px;margin-bottom:7px;font-size:14px}
.hrow .d{color:var(--sub);font-size:13px;min-width:148px}
.hrow .s{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.trend{font-size:13px;font-weight:800;padding:3px 8px;border-radius:6px}
.trend.up{background:rgba(46,230,168,.15)}
.trend.down{background:rgba(255,59,92,.15)}
.trend.flat{background:var(--panel);color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">

  <div class="hd">
    <span class="dot"></span>
    <h1 id="title">ツイキャス全体トラッカー</h1>
    <div class="seg" id="platform" style="margin-left:14px">
      <button data-k="twitcasting" class="on">ツイキャス</button>
      <button data-k="kick">Kick（日本）</button>
    </div>
    <div class="meta">
      <span class="chip" id="chip">—</span>
      <span id="lastUpdate">—</span>
      <button class="btn ghost" onclick="discover()">自動収集</button>
      <span id="bfBtns"><button class="btn ghost" onclick="backfillMissing()">未取込を補完</button>
      <button class="btn ghost" onclick="backfill()">過去取込（全員）</button></span>
      <button class="btn ghost" onclick="exportCsv()">CSV</button>
      <button class="btn ghost" onclick="exportData()">JSON</button>
    </div>
  </div>

  <div id="err"></div>

  <div class="tabs" id="mainTab">
    <button data-k="overview" class="on">全体</button>
    <button data-k="compare">PF比較</button>
    <button data-k="heatmap">時間帯</button>
    <button data-k="duration">配信時間</button>
    <button data-k="alerts">急上昇</button>
  </div>

  <!-- 全体グラフ（主役・線1本） -->
  <div id="viewOverview">
  <div class="hero">
    <div class="heroTop">
      <div>
        <div class="bigl" id="heroLabel">全体 最高同接の平均（最新日）</div>
        <div class="bigv" id="heroVal">—</div>
      </div>
      <div id="heroTotalBox">
        <div class="bigl" style="color:#2ee6a8">総来場者（最新日）</div>
        <div class="bigv" id="heroVal2" style="font-size:38px;color:#2ee6a8">—</div>
      </div>
      <div class="deltas" id="deltas"></div>
    </div>
    <div class="ctrl">
      <div class="seg" id="range">
        <button data-k="30">30日</button>
        <button data-k="90" class="on">90日</button>
        <button data-k="365">1年</button>
        <button data-k="0">全期間</button>
      </div>
    </div>
    <canvas id="overall"></canvas>
    <div class="note" id="note"></div>
  </div>

  <div class="stats3" id="stats3"></div>

  <div class="sect">個別の配信者
    <span class="sub">数値は最高同接ベース／クリックで詳細</span>
    <span class="sp"></span>
    <div class="seg" id="listSort">
      <button data-k="pct" class="on">上昇率順</button>
      <button data-k="pctAsc">下落率順</button>
      <button data-k="recent">直近平均順</button>
      <button data-k="all">通算平均順</button>
      <button data-k="name">名前順</button>
    </div>
    <div class="seg" id="trendBase">
      <button data-k="b5" class="on">直近5配信</button>
      <button data-k="d7">7日</button>
      <button data-k="d30">30日</button>
    </div>
    <div class="seg" id="listFilter">
      <button data-k="active" class="on">稼働中</button>
      <button data-k="live">配信中</button>
      <button data-k="pinned">手動</button>
      <button data-k="dormant">休止</button>
    </div>
  </div>

  <div class="addbar">
    <input id="inp" placeholder="https://twitcasting.tv/xxxxx または https://kick.com/xxxxx を貼り付け（Enterで追加）">
    <button class="btn" onclick="addBroadcaster()">追加</button>
  </div>

  <div class="tbl" id="tbl"></div>
  </div>

  <div id="viewCompare" style="display:none">
    <div class="hero">
      <div class="bigl">ツイキャス vs Kick（日本）</div>
      <canvas id="cmpChart" style="height:440px!important;margin-top:14px"></canvas>
      <div class="note">両プラットフォームの「最高同接の平均」を同一軸で比較します。Kickは監視開始以降のデータのみ。</div>
    </div>
    <div class="stats3" id="cmpStats"></div>
  </div>

  <div id="viewHeatmap" style="display:none">
    <div class="hero">
      <div class="bigl">曜日 × 時間帯（日本時間）</div>
      <div class="note" style="margin:8px 0 18px">色が濃いほど平均同接が高い時間帯です。配信時間を決める材料になります。</div>
      <div class="hmwrap" id="hmOverall"></div>
    </div>
  </div>

  <div id="viewDuration" style="display:none">
    <div class="hero">
      <div class="bigl">配信時間と同接の関係</div>
      <div class="note" style="margin:8px 0 18px">長時間配信が本当に同接に効いているかを確認できます。</div>
      <div id="durList"></div>
    </div>
  </div>

  <div id="viewAlerts" style="display:none">
    <div class="hero">
      <div class="bigl">急上昇している配信者</div>
      <div class="ctrl" style="margin-top:12px">
        <div class="seg" id="alertTh">
          <button data-k="30">+30%以上</button>
          <button data-k="50" class="on">+50%以上</button>
          <button data-k="100">+100%以上</button>
        </div>
      </div>
      <div id="alertList"></div>
    </div>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const API=location.origin+'/api';
let config={broadcasters:[]},stats={},overall=[];
let oChart=null,dChart=null,openUid=null;
let platform='twitcasting';
let mainTab='overview',alertTh=50;
let cmpChart=null;
let range=90,listSort='pct',listFilter='active',trendBase='b5';
const PH='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect fill=%22%231b2233%22 width=%2260%22 height=%2260%22/%3E%3C/svg%3E';
const METRIC_LABEL={overall_avg:'全体平均同接',overall_avg_peak:'全体平均ピーク',
  overall_total_viewers:'総来場者',broadcasts:'配信数'};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('ja-JP');
const tcUrl=u=>String(u).startsWith('kick:')?('https://kick.com/'+String(u).slice(5)):('https://twitcasting.tv/'+encodeURIComponent(u).replace(/%3A/gi,':'));
function withAlpha(hex,a){const h=String(hex).replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;}
function movingAvg(arr,win){
  const out=[];
  for(let i=0;i<arr.length;i++){
    const s=Math.max(0,i-win+1);
    const seg=arr.slice(s,i+1).filter(v=>v!=null&&!isNaN(v));
    out.push(seg.length?Math.round(seg.reduce((t,v)=>t+v,0)/seg.length):null);
  }
  return out;
}
const winFor=n=>n<=31?3:n<=95?7:n<=200?14:30;
const mean=a=>a.length?Math.round(a.reduce((t,v)=>t+v,0)/a.length):null;
const dayJp=d=>{const x=new Date(d+'T00:00:00+09:00');
  return `${x.getMonth()+1}/${x.getDate()}(${'日月火水木金土'[x.getDay()]})`;};

/* グラフ共通 */
function gradFill(color,strong){return ctx=>{const{chart}=ctx,{ctx:c,chartArea}=chart;
  if(!chartArea)return withAlpha(color,.22);
  const g=c.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
  const a=strong?1:.78;
  g.addColorStop(0,withAlpha(color,.62*a));
  g.addColorStop(.35,withAlpha(color,.30*a));
  g.addColorStop(.72,withAlpha(color,.11*a));
  g.addColorStop(1,withAlpha(color,.02*a));
  return g;};}
function lineStyle(color,{fill=true,dash=null}={}){
  return{borderColor:color,backgroundColor:fill?gradFill(color,true):'transparent',fill:fill?'origin':false,
    borderWidth:2.4,borderDash:dash||[],tension:.36,cubicInterpolationMode:'monotone',
    pointRadius:4.5,pointHoverRadius:8,pointBackgroundColor:'#0b0e14',pointBorderColor:color,
    pointBorderWidth:2.2,pointHoverBorderWidth:3,pointHitRadius:16};}
const AXIS={x:{grid:{display:false},border:{display:false},
    ticks:{color:'#98a3ba',font:{size:13,weight:'600'},padding:10,maxRotation:0,autoSkipPadding:26}},
  y:{beginAtZero:true,grid:{color:'rgba(255,255,255,.07)',drawTicks:false},border:{display:false},
    ticks:{color:'#98a3ba',font:{size:13,weight:'600'},padding:12,maxTicksLimit:6}}};
const LEGEND={display:true,position:'top',align:'end',
  labels:{color:'#c3ccdd',boxWidth:11,boxHeight:11,usePointStyle:true,pointStyle:'circle',
    font:{size:14,weight:'700'},padding:20}};
const TIP={backgroundColor:'rgba(13,17,26,.98)',borderColor:'rgba(255,255,255,.14)',borderWidth:1,
  titleColor:'#ffffff',bodyColor:'#dbe3f0',padding:16,cornerRadius:12,caretSize:7,
  boxWidth:10,boxHeight:10,usePointStyle:true,
  titleFont:{size:15,weight:'800'},bodyFont:{size:14,weight:'600',family:'monospace'},
  bodySpacing:7,titleMarginBottom:10,displayColors:false};
const NOANIM={animation:false,animations:{colors:false,x:false,y:false},
  transitions:{active:{animation:{duration:160}}}};

/* パルス */
let ph=0;
Chart.register({id:'pulse',afterDatasetsDraw(ch){
  if(!ch.$pulse||!ch.$pulse.length)return;
  const t=(Math.sin(ph)+1)/2;
  ch.$pulse.forEach(i=>{const ds=ch.data.datasets[i];if(!ds||!ds.data.length)return;
    const m=ch.getDatasetMeta(i),pt=m.data[m.data.length-1];if(!pt)return;
    const col=ds.borderColor||'#5b8cff',c=ch.ctx;
    c.save();c.beginPath();c.arc(pt.x,pt.y,4+t*9,0,Math.PI*2);
    c.fillStyle=withAlpha(col,.30*(1-t));c.fill();
    c.beginPath();c.arc(pt.x,pt.y,3.4,0,Math.PI*2);c.fillStyle=col;c.fill();
    c.strokeStyle='#0b0e14';c.lineWidth=1.4;c.stroke();c.restore();});
}});
(function loop(){ph+=.075;[oChart,dChart].forEach(c=>{if(c&&c.$pulse&&c.$pulse.length){try{c.draw()}catch(e){}}});
  requestAnimationFrame(loop);})();

/* データ */
function samplesOf(s){if(!s)return[];const a=[];
  (s.history||[]).forEach(b=>a.push(...(b.samples||[])));
  if(s.current_broadcast)a.push(...(s.current_broadcast.samples||[]));
  return a.sort((x,y)=>new Date(x.timestamp)-new Date(y.timestamp));}
const isLive=s=>!!(s&&s.current_broadcast);
function latest(s){const a=samplesOf(s).filter(x=>x.concurrent>0);return a.length?a[a.length-1]:null;}
function broadcastsOf(st){if(!st)return[];
  const list=[...(st.history||[])];
  if(st.current_broadcast)list.push({...st.current_broadcast,_live:true});
  return list.map(b=>{const sm=(b.samples||[]).filter(x=>x.concurrent>0);
    if(sm.length)return{t:new Date(b.started_at).getTime(),started_at:b.started_at,live:!!b._live,archive:false,
      avg:Math.round(sm.reduce((a,x)=>a+x.concurrent,0)/sm.length),
      peak:Math.max(...sm.map(x=>x.concurrent)),total:sm[sm.length-1].total};
    if(b.source==='archive'&&(b.peak||b.total_final))return{t:new Date(b.started_at).getTime(),
      started_at:b.started_at,live:false,archive:true,avg:null,peak:b.peak||0,total:b.total_final||0};
    return null;}).filter(Boolean).sort((a,b)=>a.t-b.t);}
const valOf=x=>x.peak;              // 全期間で一貫して比較できるのは最高同接
const realAvgOf=x=>x.avg;           // 実測の平均同接（監視開始以降のみ）

// 個別: 日別平均
function dailyOf(bs){
  const m={};
  bs.forEach(x=>{const k=new Date(x.t+9*3600e3).toISOString().slice(0,10);
    (m[k]=m[k]||[]).push(valOf(x));});
  return Object.keys(m).sort().map(k=>({day:k,val:mean(m[k]),n:m[k].length}));
}
// 日数ベース: 直近N日の平均 vs その前N日の平均
function trendDays(bs,days){
  const daily=dailyOf(bs);
  if(daily.length<2)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const dayKey=d=>new Date(d.getTime()+9*3600e3).toISOString().slice(0,10);
  const cut1=new Date(today.getTime()-days*864e5), cut2=new Date(today.getTime()-days*2*864e5);
  const k1=dayKey(cut1),k2=dayKey(cut2);
  const recent=daily.filter(d=>d.day>k1).map(d=>d.val);
  const prev=daily.filter(d=>d.day>k2&&d.day<=k1).map(d=>d.val);
  if(!recent.length||!prev.length)return null;
  const r=mean(recent),p=mean(prev);
  if(!p)return null;
  return{recent:r,prev:p,pct:Math.round((r-p)/p*100),n:days,unit:'日',count:daily.length};
}
function trendBy(bs){
  if(trendBase==='d7')return trendDays(bs,7);
  if(trendBase==='d30')return trendDays(bs,30);
  return trendOf(bs);
}
function trendOf(bs){
  const done=bs.filter(x=>!x.live);if(done.length<2)return null;
  const v=done.map(valOf);
  const n=Math.max(1,Math.min(5,Math.floor(v.length/2)));
  const r=mean(v.slice(-n)),p=mean(v.slice(-2*n,-n));
  if(p==null)return null;
  return{recent:r,prev:p,pct:p?Math.round((r-p)/p*100):0,n,count:done.length};
}

  const avgs=rows.map(r=>{
    if(r.overall_avg==null)return null;

    return cov>=0.35?Number(r.overall_avg):null;   // 測定カバー率35%未満の日は信頼できないので除外
  });
  const tots=rows.map(r=>Number(r.overall_total_viewers||0));

        ...lineStyle('#ffb340',{fill:false}),borderWidth:2.4,borderDash:[5,4],
        pointRadius:many?0:4,pointHoverRadius:7,spanGaps:false,yAxisID:'y',order:3}]:[]),
    ]},
    options:{responsive:true,maintainAspectRatio:false,...NOANIM,
      layout:{padding:{top:8,right:12,left:2,bottom:2}},

            const out=[

            if(r.overall_avg!=null) out.push(` 実測の平均同接      ${fmt(r.overall_avg)}（${r.measured_broadcasts}/${r.broadcasts}配信を計測）`);

  document.getElementById('modal').innerHTML=`
    <div class="mh">
      <img class="avatar" src="${esc(b.image||PH)}" onerror="this.src='${PH}'">
      <div style="min-width:0">
        <h2><a href="${tcUrl(uid)}" target="_blank" rel="noopener">${esc(b.name)} ↗</a></h2>
        <div class="u2" style="margin-top:6px">${esc(uid)}
          ${live?'<span class="tag live">LIVE</span>':''}
          <span class="tag ${b.pinned?'pin':''}">${b.pinned?'手動':'自動'}</span>
          ${b.dormant?'<span class="tag dor">休止</span>':''}</div>
      </div>
      <button class="x" onclick="closeModal()">✕</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">現在の同接</div><div class="v">${live?fmt(l&&l.concurrent):'—'}</div></div>
      <div class="kpi"><div class="l">直近の最高同接平均</div><div class="v">${fmt(tr?tr.recent:(bs.length?valOf(bs[bs.length-1]):null))}</div></div>
      <div class="kpi"><div class="l">通算の最高同接平均</div><div class="v">${fmt(bs.length?mean(bs.map(valOf)):null)}</div></div>
      <div class="kpi"><div class="l">最高同接</div><div class="v">${fmt(peak)}</div></div>
      <div class="kpi"><div class="l">トレンド</div><div class="v ${tr?(tr.pct>0?'up':tr.pct<0?'down':'flat'):'flat'}">${tr?(tr.pct>0?'+':'')+tr.pct+'%':'—'}</div></div>
      <div class="kpi"><div class="l">記録配信数</div><div class="v">${bs.filter(x=>!x.live).length}</div></div>
    </div>
    <div class="cbox"><h3>日ごとの最高同接<span style="color:var(--sub);font-weight:400;font-size:11px">（過去配信は最高同接しか取得できないため）</span></h3><canvas id="dc"></canvas></div>
    <div class="sect" style="margin-top:24px">配信ごとの記録</div>
    ${bs.length?[...bs].reverse().slice(0,60).map((x,i,arr)=>{
      const prev=arr[i+1],v=valOf(x);
      let t='<span class="trend flat">—</span>';
      if(prev){const pv=valOf(prev),d=v-pv,p=pv?Math.round(d/pv*100):0;
        t=d>0?`<span class="trend up">▲ ${p}%</span>`:d<0?`<span class="trend down">▼ ${Math.abs(p)}%</span>`:'<span class="trend flat">±0</span>';}
      return`<div class="hrow">
        <span class="d">${new Date(x.started_at).toLocaleString('ja-JP',{year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
        ${t}<span class="s">${x.avg!=null?`平均 ${fmt(x.avg)}`:`最高 ${fmt(x.peak)}`} ／ 総 ${fmt(x.total)}${x.archive?' <span style="color:var(--sub);font-weight:400">(過去)</span>':x.live?' <span style="color:var(--live);font-weight:400">(配信中)</span>':''}</span>
      </div>`;}).join(''):'<div class="empty">まだ配信記録がありません</div>'}`;

  if(dChart){dChart.destroy();dChart=null;}
  if(daily.length){
    const dv=daily.map(d=>d.val);
    const win=winFor(daily.length);
    const ma=movingAvg(dv,win);
    const many=daily.length>45;
    dChart=new Chart(document.getElementById('dc'),{type:'line',
      data:{labels:daily.map(d=>d.day),datasets:[
        {label:`${win}日移動平均`,data:ma,...lineStyle('#ff3b5c'),
         borderWidth:3,pointRadius:many?0:4,pointHoverRadius:7,order:1}
      ]},
      options:{responsive:true,maintainAspectRatio:false,...NOANIM,
        layout:{padding:{top:8,right:10,left:2,bottom:2}},
        interaction:{mode:'index',intersect:false},
        plugins:{legend:LEGEND,
          tooltip:{...TIP,callbacks:{
            title:it=>dayJp(daily[it[0].dataIndex].day),
            label:it=>{if(it.datasetIndex)return null;const i=it.dataIndex,d=daily[i];
              return[` 日次平均   ${fmt(d.val)}`,` ${win}日移動平均 ${fmt(ma[i])}`,` 配信数     ${d.n}`];}}}},
        scales:{x:{...AXIS.x,ticks:{...AXIS.x.ticks,callback:function(v){
            const d=this.getLabelForValue(v);if(!d)return'';
            const x=new Date(d+'T00:00:00+09:00');return`${x.getMonth()+1}/${x.getDate()}`;}}},
          y:AXIS.y}}});
    dChart.$pulse=live?[0]:[];
  }
}

/* ===== 操作 ===== */
function extractUserId(v){
  v=v.trim();
  const k=v.match(/kick\.com\/([^/?#]+)/i);
  if(k)return 'kick:'+k[1];
  const t=v.match(/twitcasting\.tv\/([^/?#]+)/);
  if(t)return t[1];
  if(/^kick:/i.test(v))return 'kick:'+v.replace(/^kick:/i,'');
  return platform==='kick'?('kick:'+v):v;
}
async function addBroadcaster(){
  const el=document.getElementById('inp'),v=el.value.trim();
  if(!v)return showErr('URLを入力してください');
  try{const r=await fetch(API+'/config/broadcasters',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:extractUserId(v)})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'追加できませんでした');
    el.value='';await loadAll();}catch(e){showErr('追加エラー: '+e.message);}
}
async function removeBroadcaster(uid){
  if(!confirm('削除しますか？（記録も消えます）'))return;
  try{await fetch(API+'/config/broadcasters/'+encodeURIComponent(uid),{method:'DELETE'});
    if(openUid===uid)closeModal();await loadAll();}catch(e){showErr('削除エラー: '+e.message);}
}
async function wake(uid){
  try{await fetch(API+'/wake/'+encodeURIComponent(uid),{method:'POST'});
    showErr('監視を再開しました');await loadAll();}catch(e){showErr('エラー: '+e.message);}
}
async function discover(){
  showErr('配信中の上位を検索しています…');
  try{const r=await fetch(API+'/discover?platform='+platform,{method:'POST'});const j=await r.json();
    if(!j.ok){showErr('自動収集エラー: '+(j.reason||'unknown'));return;}
    showErr(`${(j.added||[]).length}人追加／${(j.slept||[]).length}人休止（枠 ${j.auto_slots}）`);
    await loadAll();}catch(e){showErr('自動収集エラー: '+e.message);}
}
let bfTimer=null;
async function backfillMissing(){
  try{
    const r=await fetch(API+'/backfill-missing',{method:'POST'});
    const j=await r.json();
    if(j.reason==='nothing_to_do'){showErr('未取込の配信者はいません');return;}
    if(j.reason==='already_running'){showErr('すでに取り込み中です');}
    pollBackfill();
  }catch(e){showErr('エラー: '+e.message);}
}
async function backfill(){
  if(!confirm('登録中の全配信者の過去配信を取り込みます。サーバー側で実行されるので、このページを閉じても続行します。'))return;
  try{
    const r=await fetch(API+'/backfill',{method:'POST'});
    const j=await r.json();
    if(!j.started&&j.reason==='already_running') showErr('すでに取り込み中です');
    pollBackfill();
  }catch(e){showErr('取込エラー: '+e.message);}
}
async function pollBackfill(){
  if(bfTimer)clearInterval(bfTimer);
  const tick=async()=>{
    try{
      const j=await fetch(API+'/backfill/status').then(r=>r.json());
      if(j.running){
        showErrPersist(`過去配信を取込中… ${j.done}/${j.totalTargets}人・${j.imported}件`);
      }else{
        clearInterval(bfTimer);bfTimer=null;
        if(j.finishedAt){showErr(`取込完了：${j.imported}件`);await loadAll();}
        else{const e=document.getElementById('err');if(e)e.innerHTML='';}
      }
    }catch(e){clearInterval(bfTimer);bfTimer=null;}
  };
  await tick();
  bfTimer=setInterval(tick,2000);
}
function showErrPersist(m){document.getElementById('err').innerHTML=`<div class="err">${esc(m)}</div>`;}
function exportData(){
  const blob=new Blob([JSON.stringify({overall,config,stats},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=`twitcas-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);
}
function showErr(m){document.getElementById('err').innerHTML=`<div class="err">${esc(m)}</div>`;
  setTimeout(()=>{const e=document.getElementById('err');if(e)e.innerHTML='';},6000);}

function bindSeg(id,cb){document.getElementById(id).addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  [...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.k);});}
bindSeg('platform',k=>{platform=k;closeModal();loadAll();
  if(mainTab==='heatmap')loadHeatmap();
  if(mainTab==='duration')loadDuration();
  if(mainTab==='alerts')loadAlerts();});
bindSeg('alertTh',k=>{alertTh=Number(k);loadAlerts();});
document.getElementById('mainTab').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  [...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
  showTab(b.dataset.k);});
bindSeg('range',k=>{range=Number(k);renderOverall();});
bindSeg('listSort',k=>{listSort=k;renderTable();});
bindSeg('trendBase',k=>{trendBase=k;renderTable();if(openUid)renderModal(openUid);});
bindSeg('listFilter',k=>{listFilter=k;renderTable();});

document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')addBroadcaster();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

loadAll();
setInterval(loadAll,10000);
fetch(API+'/backfill/status').then(r=>r.json()).then(j=>{if(j.running)pollBackfill();}).catch(()=>{});
</script>
